name: OTC official feed collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otc-official-feed-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Capture SEC OTC filing feed
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trigger official-source collection
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 8 --connect-timeout 20 --max-time 90 \
            --output stream.json \
            --write-out "HTTP %{http_code}\\n" \
            https://www.otcfilingwatch.com/api/stream
          python3 - <<'PY'
          import json
          with open("stream.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          items = payload.get("items")
          if not isinstance(items, list):
              raise SystemExit("stream response did not include an items list")
          print(f"Captured {len(items)} OTC-related official nodes at {payload.get('fetchedAt', 'unknown time')}")
          PY
